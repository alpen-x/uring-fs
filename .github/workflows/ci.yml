name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux-io-uring:
    name: Linux io_uring (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install liburing-dev and enable kernel io_uring
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev
          sudo sysctl -w kernel.io_uring_disabled=0 || true

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies and build native addon
        run: npm install

      - name: Run static linter & C++ -Werror check
        run: npm run lint

      - name: Verify kernel io_uring backend is active
        run: node -e "if (!require('.').isUringSupported()) { console.error('Expected io_uring to be supported'); process.exit(1); }"

      - name: Run test suite with coverage gate
        run: npm run test:coverage

  fallback-stub:
    name: Fallback Stub (${{ matrix.os }}, Node 24.x)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      URING_FS_BUILD_FROM_SOURCE: '1'
      URING_FS_IGNORE_PREBUILDS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure liburing headers are absent (Linux stub test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get remove -y liburing-dev || true

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies and build stub addon
        run: npm install

      - name: Run static linter
        run: npm run lint

      - name: Run test suite in fallback mode
        run: npm test
