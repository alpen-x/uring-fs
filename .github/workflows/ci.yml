name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x, 24.x ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install liburing-dev
        run: sudo apt-get update && sudo apt-get install -y liburing-dev build-essential

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable io_uring in GitHub Actions runner
        run: sudo sysctl -w kernel.io_uring_disabled=0 || true

      - name: Install dependencies & build native addon
        run: npm install

      - name: Run test suite
        run: npm test
