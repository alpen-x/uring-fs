name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-prebuilds:
    name: Prebuild ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.libc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            libc: glibc
            os: ubuntu-24.04
          - platform: linux
            arch: arm64
            libc: glibc
            os: ubuntu-24.04-arm
          - platform: linux
            arch: x64
            libc: musl
            os: ubuntu-24.04
          - platform: linux
            arch: arm64
            libc: musl
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: Build and verify prebuilt binary (Ubuntu / glibc)
        if: matrix.libc == 'glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev build-essential python3
          sudo sysctl -w kernel.io_uring_disabled=0 || true
          npm run prebuild
          f=$(echo prebuilds/linux-*/uring_fs.glibc.node)
          test -f "$f"
          dynsym=$(nm -D "$f")
          ! printf '%s\n' "$dynsym" | grep -q 'io_uring_'
          URING_FS_PREBUILD_ONLY=1 node -e "if (!require('.').isUringSupported()) { console.error('Prebuild io_uring unsupported:', require('.').getUnsupportedReason()); process.exit(1); }"
          URING_FS_PREBUILD_ONLY=1 npm test

      - name: Build and verify prebuilt binary (Alpine / musl via Docker)
        if: matrix.libc == 'musl'
        run: |
          sudo sysctl -w kernel.io_uring_disabled=0 || true
          docker run --rm --privileged -v "$PWD:/work" -w /work alpine:3.21 sh -c "
            apk add --no-cache nodejs npm python3 make g++ liburing-dev linux-headers binutils &&
            npm run prebuild &&
            f=\$(echo prebuilds/linux-*/uring_fs.musl.node) &&
            test -f \"\$f\" &&
            dynsym=\$(nm -D \"\$f\") &&
            ! printf '%s\n' \"\$dynsym\" | grep -q 'io_uring_' &&
            URING_FS_PREBUILD_ONLY=1 node -e \"if (!require('.').isUringSupported()) { console.error('Prebuild io_uring unsupported:', require('.').getUnsupportedReason()); process.exit(1); }\" &&
            URING_FS_PREBUILD_ONLY=1 npm test
          "
          sudo chown -R "$(id -u):$(id -g)" prebuilds build || true

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.libc }}
          path: prebuilds/
          retention-days: 1

  publish:
    name: Build, Verify & Publish to npm
    needs: build-prebuilds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install liburing-dev and enable kernel io_uring
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev
          sudo sysctl -w kernel.io_uring_disabled=0 || true

      - name: Setup Node.js 24.x for npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC Trusted Publishing support
        run: npm install -g npm@latest

      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true

      - name: Verify prebuilt binaries
        run: |
          ls -laR prebuilds/
          test -f prebuilds/linux-x64/uring_fs.glibc.node
          test -f prebuilds/linux-x64/uring_fs.musl.node
          test -f prebuilds/linux-arm64/uring_fs.glibc.node
          test -f prebuilds/linux-arm64/uring_fs.musl.node

      - name: Install dependencies and build native addon
        run: npm install

      - name: Run full test suite before publishing
        run: npm run check

      - name: Publish or Stage package to npm (OIDC Trusted Publishing or NPM_TOKEN)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "v${pkg_ver}" != "${GITHUB_REF_NAME:-}" ]; then
            echo "Error: package.json version (${pkg_ver}) does not match git tag (${GITHUB_REF_NAME})"
            exit 1
          fi
          npm config delete always-auth || true
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            unset NODE_AUTH_TOKEN
            npm config delete //registry.npmjs.org/:_authToken || true
          fi
          npm publish --provenance --access public || npm stage publish --provenance --access public
